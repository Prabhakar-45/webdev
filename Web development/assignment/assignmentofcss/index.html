<!DOCTYPE html>
<html lang="en">

<body>
   <fieldset>
    <h3 align="center">APPLICATION FORM</h3>
     <fieldset>
        
        <legend>Personal Details</legend>
        <div class="Personal outer">
            <label for="name">Applicant full name</label>
            <select name="" id="">
                <option value="">select</option>
                <option value="mr">Mr.</option>
                <option value="mrs">Mrs.</option>
            </select>
            <input type="name" name="name" id="name">

            <div>
                <label for="careof">Care Of :</label>
                <input type="radio" name="careof" id="careof" value="Parents">

                <input type="radio" name="careof" id="careof" value="Guardian">
                <span>Guardian</span>
            </div>

            <div>
            <label for="name">Father's name</label>
            <select name="" id="">
                <option value="">select</option>
                <option value="mr">Mr.</option>
                <option value="mrs">Mrs.</option>
            </select>
            <input type="name" name="name" id="name">
            </div>

            <div>
            <label for="name">Mother's name</label>
            <select name="" id="">
                <option value="">select</option>
                <option value="mr">Mr.</option>
                <option value="mrs">Mrs.</option>
            </select>
            <input type="name" name="name" id="name">
            </div> 




        </div>

    </fieldset>
   </fieldset>
