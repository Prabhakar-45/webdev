<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend align="center">Task 4 :</legend>
        <table border="1" >
            <tr>
                <th colspan="4"><b>Registration form</b></th>
            </tr> 
            <tr>
                <th><label for="first name">Student Name</label></th>
                <th><input type="text" name="first name" placeholder="First name"></th>
                <th><input type="text" name="middle name" placeholder="Middle name"></th>
                <th><input type="text" name="last name" placeholder="Last name"></th>
                 
            </tr>

            <tr>
            <td>Father's Name</td>
            <td><input type="text" name="father_name" placeholder="Enter your father's Name"></td>
            <td>Mother's Name</td>
            <td><input type="text" name="mother_name" placeholder="Enter your Mother's Name"></td>
            </tr>

        
        <tr>
            <td>Date of Birth</td>
            <td><input type="date" name="dob"></td>
            <td>Gender</td>
            <td>
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
            </td>
        </tr>

        
        <tr>
            <td>Category</td>
            <td>
                <label><input type="radio" name="category" value="Gen"> Gen</label>
                <label><input type="radio" name="category" value="OBC"> OBC</label>
                <label><input type="radio" name="category" value="SC/ST"> SC/ST</label>
            </td>
            <td>Handicapped</td>
            <td>
                <label><input type="radio" name="handicapped" value="Yes"> Yes</label>
                <label><input type="radio" name="handicapped" value="No"> No</label>
            </td>
        </tr>

        
        <tr>
            <td>Ex-Serviceman</td>
            <td>
                <label><input type="radio" name="ex_serviceman" value="Yes"> Yes</label>
                <label><input type="radio" name="ex_serviceman" value="NO"> NO</label>
            </td>
            <td>EWS</td>
            <td>
                <label><input type="radio" name="ews" value="Yes"> Yes</label>
                <label><input type="radio" name="ews" value="No"> No</label>
            </td>
        </tr>

        <tr>
            <td>Email ID</td>
            <td><input type="email" name="email"></td>
            <td>Mobile No.</td>
            <td><input type="text" name="mobile"></td>
        </tr>

        
        <tr>
            <td>State</td>
            <td>
                <select name="state">
                    <option value="">Select any One</option>
                </select>
            </td>
            <td>City</td>
            <td>
                <select name="city">
                    <option value="">Select any One</option>
                </select>
            </td>
        </tr>

        
        <tr>
            <td>Upload Photo</td>
            <td><input type="file" name="photo"></td>
            <td>Upload Signature</td>
            <td><input type="file" name="signature"></td>
        </tr>

        
        <tr>
            <td colspan="4" style="text-align: center;">
                <input type="submit" value="Submit">
            </td>
        </tr>
        </table>
    </fieldset>
</body>
</html>
