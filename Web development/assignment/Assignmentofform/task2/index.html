<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend align="center">Task 2 :</legend>
        <form action="">
            <h1><i>Pizza order form</i></h1>
            <label for="first name">First Name :</label>
            <input type="firstname" name="firstname" id="firstname">

            <br>

            <label for="lastname">Last Name :</label>
            <input type="lastname" name="lastname" id="lastname">

            <br>
            <label for="email">Email Adress :</label>
            <input type="email" name="email" id="email">

            <br>

            <label for="contact">Contact number :</label>
            <input type="number" name="contact" id="contact">

            <br>

            <label for="date">Preferred Delivery Date :</label>
            <input type="date" name="date" id="date">

            <br>
            <label for="size">size :</label>
            <br>
            <input type="radio" name="size" id="size" value="small">
            <span>small</span>
            <input type="radio" name="size" id="size" value="medium">
            <span>medium</span>
            <input type="radio" name="size" id="size" value="medium">
            <span>large</span>

            <br>
            <label for="flavour">Flavour :</label>
            <br>

             <input type="checkbox" name="flavour" id="flavour" value="Hawaiian(Php 150.00)">
            <span>Hawaiian(Php 150.00)</span>
            <br>

            <input type="checkbox" name="flavour" id="flavour" value="Pepperoni(Php 140.00)">
            <span>Pepperoni(Php 140.00)</span>
            <br>

            <input type="checkbox" name="flavour" id="flavour" value="vegetable(Php 130.00)">
            <span>Pepperoni(Php 140.00)</span>

            <br>
            <br>

            <label for="credit card ">Credit card number :</label>
            <input type="number" name="credit card" id="credit card">

            <br>
            <br>
            
            <label for="pin ">PIN :</label>
            <input type="number" name="pin" id="pin">

            <br>
            <br>
            <label for="Additional note">Additional note  :</label>
            <br>
            <textarea name="Additional note" id="Additional note"></textarea>

            <br>
            <br>
            <button>Submit order</button>


        </form>
    </fieldset>
</body>
</html>
