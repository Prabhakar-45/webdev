<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <fieldset>
      <legend align="center">BASIC FORM</legend>
      <form>
        <label for="fullname">Full Name :</label>
        <input type="text" name="yourname" id="fullname" />

        <br />
        <br />
        <br />

        <label for="email">Email :</label>
        <input type="text" name="email" id="email" placeholder="youremail" />

        <br />
        <br />
        <br />

        <label for="password">password</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Your Password"
        />

        <br />
        <br />
        <label for="cfpassword">Confirm Password</label>
        <input
          type="password"
          name="cfpassword"
          id="cfpassword"
          placeholder="confirm Your Password"
        />
        <br />
        <br />
        <label for="dob">date of birth :</label>
        <input type="date" name="dob" id="dob" />

        <br />
        <br />
        <label for="joiningTime">Joining Time :</label>
        <input type="datetime-local" name="joiningTime" id="joiningTime" />
        <br />
        <br />
        <label for="volume">volume</label>
        <input
          type="range"
          name="volume"
          id="volume"
          min="0"
          max="10"
          value="3"
        />
        <br />
        <br />
        <label for="mobile">Mobile :- </label>
        <input type="number" name="mobile" id="mobile" />
        <br />
        <br />
        <label for="age">Age :-</label>
        <input type="number" name="age" id="age" />

        <br />
        <br />

        <label for="resume"> Resume :</label>
        <input type="file" name="resume" id="resume" />

        <br />
        <br />

        <label for="adress">Adress</label>
        <textarea name="adress" id="">adress</textarea>

        <br />
        <br />
        <label for="course">Course :</label>
        <select name="course" id="">
          course
          <option value=" ">--select course--</option>
          <option value="Btech">B.Tech</option>
          <option value="mtech">M.Tech</option>
          <option value="bba">BBA</option>
          <option value="mca">MCA</option>
        </select>

        <br />
        <br />

        <label for="gender">Gender</label>
        <input type="radio" name="gender" id="male" value="male" />
        <span>male</span>
        <input type="radio" name="gender" id="male" value="male" />
        <span>female</span>
        <input type="radio" name="gender" id="male" value="male" />
        <span>other</span>

        <br />
        <br />

        <label for="skillset">skill set :</label>
        <input type="checkbox" name="skillset" id="java" value="java" />
        <span>java</span>
        <input type="checkbox" name="skillset" id="dsa" value="dsa" />
        <span>dsa</span>
        <input type="checkbox" name="skillset" id="html" value="html" />
        <span>html</span>

        <br />
        <br />

        <img src="./flower.jfif" alt="" width="50" height="40" />

        <br />
        <br />

        <iframe
          width="1059"
          height="595"
          src="https://www.youtube.com/embed/q678XLOueN8"
          title="Deep Sea Mysteries That Science Can&#39;t Explain! | Dhruv Rathee"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>

        <br />
        <br />
        <iframe
          width="1059"
          height="595"
          src="https://www.youtube.com/embed/tVzUXW6siu0?list=PLu0W_9lII9agq5TrH9XLIKQvv0iaF2X3w"
          title="Installing VS Code &amp; How Websites Work | Sigma Web Development Course - Tutorial #1"
          frameborder="0"

            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>

        <br />
        <a href="https://github.com/Prabhakar-45">Github</a>

        <br />
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3665.7739269599815!2d77.52100747514774!3d23.251312379014045!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x397c4244c97d6f29%3A0x72457a4e85fd116c!2sLNCT%20Group%20of%20Colleges!5e0!3m2!1sen!2sin!4v1789996688390!5m2!1sen!2sin"

        <button>submit</button>

</html>
